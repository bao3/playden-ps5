# Build and test this fork. A version tag such as v0.11.0b also publishes a GitHub Release.
# Pull requests and pushes to main do not publish.
name: Fork build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*b']

permissions:
  contents: read

jobs:
  host-tests:
    # macos-13 was removed on 2025-12-04 and macOS 14 on 2026-11-02.
    # macos-15-intel is a current standard GitHub-hosted Intel label.
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Mask the injected mirror address
        env:
          PLAYDEN_GITHUB_MIRROR_BASE_URL: ${{ secrets.PLAYDEN_GITHUB_MIRROR_BASE_URL }}
        run: python3 -c 'import os,sys; v=os.environ.get("PLAYDEN_GITHUB_MIRROR_BASE_URL",""); sys.stdout.write("::add-mask::%s\n"%v if v else ""); print("mirror-address-configured:", "yes" if v else "no")'
      - name: Install the host toolchain
        run: brew install cmake ninja pkgconf sdl2-compat
      - name: Build and run the selected tests
        env:
          PLAYDEN_GITHUB_MIRROR_BASE_URL: ${{ secrets.PLAYDEN_GITHUB_MIRROR_BASE_URL }}
        run: |
          set -euo pipefail
          python3 -c 'import os,sys; v=os.environ.get("PLAYDEN_GITHUB_MIRROR_BASE_URL",""); sys.stdout.write("::add-mask::%s\n"%v if v else "")'
          scripts/build-homebrew.sh
          cmake --build --preset homebrew-host --target \
            preferences_test network_proxy_test proxy_transport_test \
            http_client_test cm_client_test github_mirror_test fork_downloads_test \
            self_update_version_test self_update_download_test self_update_service_test \
            homebrew_library_model_test homebrew_live_model_test
          ctest --preset homebrew-host --output-on-failure \
            -R '^(preferences|network_proxy|proxy_transport|http_client|cm_client|github_mirror|fork_downloads|self_update_version|self_update_download|self_update_service|homebrew_library_model|homebrew_live_model)$'
          python3 -c 'import os,pathlib,sys; v=os.environ.get("PLAYDEN_GITHUB_MIRROR_BASE_URL",""); p=pathlib.Path("build/homebrew-host/github_mirror_test"); d=p.read_bytes() if p.is_file() else b""; present=bool(v) and v.encode() in d; print("injected-config-present:", "yes" if present else "no"); sys.exit(0 if (present or not v) else 1)'

  ps5-package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Mask the injected mirror address
        env:
          PLAYDEN_GITHUB_MIRROR_BASE_URL: ${{ secrets.PLAYDEN_GITHUB_MIRROR_BASE_URL }}
        run: python3 -c 'import os,sys; v=os.environ.get("PLAYDEN_GITHUB_MIRROR_BASE_URL",""); sys.stdout.write("::add-mask::%s\n"%v if v else ""); print("mirror-address-configured:", "yes" if v else "no")'
      - name: Install the PS5 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang-18 lld-18 cmake curl git ninja-build \
            python3 unzip zip llvm-18 libdigest-sha-perl
          bindir=$(llvm-config-18 --bindir)
          if [[ ! -e "$bindir/clang" ]]; then sudo ln -sfn "$(command -v clang-18)" "$bindir/clang"; fi
          if [[ ! -e "$bindir/clang++" ]]; then sudo ln -sfn "$(command -v clang++-18)" "$bindir/clang++"; fi
          test -x "$bindir/clang"
          test -x "$bindir/ld.lld"
      - name: Build the PS5 package
        env:
          PLAYDEN_GITHUB_MIRROR_BASE_URL: ${{ secrets.PLAYDEN_GITHUB_MIRROR_BASE_URL }}
          PLAYDEN_ACCEPT_PS5_CURL_REBUILD: "1"
          PLAYDEN_DEV_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && 'OFF' || 'ON' }}
        run: |
          set -euo pipefail
          python3 -c 'import os,sys; v=os.environ.get("PLAYDEN_GITHUB_MIRROR_BASE_URL",""); sys.stdout.write("::add-mask::%s\n"%v if v else "")'
          export PATH="$(llvm-config-18 --bindir):$PATH"
          export HOST_CXX=clang++
          scripts/fetch-deps.sh
          scripts/build-lapy-helper.sh
          scripts/build-homebrew-ps5.sh
          version=$(tr -d '[:space:]' < build/homebrew-ps5/dist/FAKE77031/playden-version)
          python3 - "$version" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("CMakeLists.txt").read_text()
          match = re.search(r"project\(PlaydenLauncher VERSION ([0-9]+\.[0-9]+\.[0-9]+)", text)
          if not match or sys.argv[1] != match.group(1) + "b":
              raise SystemExit("playden-version is not the upstream version plus b")
          PY
          python3 - <<'PY'
          import json, pathlib, re
          param = json.loads(pathlib.Path("build/homebrew-ps5/dist/FAKE77031/sce_sys/param.json").read_text())
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", param["contentVersion"]):
              raise SystemExit("contentVersion must stay numeric")
          PY
          python3 -c 'import os,pathlib,sys; v=os.environ.get("PLAYDEN_GITHUB_MIRROR_BASE_URL",""); p=pathlib.Path("build/homebrew-ps5/dist/FAKE77031/eboot.bin"); d=p.read_bytes() if p.is_file() else b""; present=bool(v) and v.encode() in d; print("injected-config-present:", "yes" if present else "no"); sys.exit(0 if (present or not v) else 1)'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            got=$(tr -d '[:space:]' < build/homebrew-ps5/dist/FAKE77031/playden-version)
            test "$got" = "$ver"
            mkdir -p build/release
            (cd build/homebrew-ps5/dist && zip -r -q "$GITHUB_WORKSPACE/build/release/playden-ps5-${ver}.zip" FAKE77031)
          fi
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ps5-package
          path: build/release/playden-ps5-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, ps5-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ps5-package
          path: release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          app="release/playden-ps5-${ver}.zip"
          kit="release/playden-kit-0.21.zip"
          test -f "$app"
          # Copy the pinned kit onto this fork. The published manifest names the asset only.
          curl -fsSL -o "$kit" \
            "https://github.com/leolobato/playden-ps5/releases/download/v0.11.0-beta.2/playden-kit-0.21.zip"
          echo "ac442f6a4359e0f6a0d7f81c31d00682930f8e683118aea44a3af83b7e45186d  $kit" | sha256sum -c -
          python3 - "$kit" <<'PY'
          import hashlib, sys, zipfile
          pin = "66e5878d064645d0bda413553ee7ff9ce8f5f20b6d2807c329c58c9455c44550"
          name = "playden-kit-0.21/playden-kit/manifest.json"
          with zipfile.ZipFile(sys.argv[1]) as archive:
              digest = hashlib.sha256(archive.read(name)).hexdigest()
          if digest != pin:
              raise SystemExit("kit manifest does not match the pin")
          print("kit-manifest-matches-pin: yes")
          PY
          notes="Fork build ${ver}. This release includes the Playden app and runtime kit 0.21. The PS5 content version stays numeric."
          python3 tools/write_update_manifest.py \
            --app-zip "$app" \
            --kit-zip "$kit" \
            --kit-revision 0.21 \
            --tag "$GITHUB_REF_NAME" \
            --min-from 0.6.0 \
            --notes "$notes" \
            --out release/playden-update.json
          python3 - <<'PY'
          import json, pathlib
          text = pathlib.Path("release/playden-update.json").read_text()
          if "leolobato" in text:
              raise SystemExit("manifest names another repository")
          manifest = json.loads(text)
          if manifest["kit"]["asset"] != "playden-kit-0.21.zip":
              raise SystemExit("manifest kit asset is not the pinned kit zip")
          print("manifest-kit-asset:", manifest["kit"]["asset"])
          PY
          (
            cd release
            sha256sum "playden-ps5-${ver}.zip" playden-kit-0.21.zip playden-update.json > SHA256SUMS
          )
          files=(
            "$app"
            "$kit"
            release/playden-update.json
            release/SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
            gh release edit "$GITHUB_REF_NAME" --draft=false --target "$GITHUB_SHA" \
              --title "Playden for PS5 ${ver}" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Playden for PS5 ${ver}" \
              --notes "$notes" \
              "${files[@]}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release/published-release.json
          gh release download "$GITHUB_REF_NAME" --pattern playden-update.json --dir release/published --clobber
          python3 - <<'PY'
          import json, os, pathlib
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:]
          release = json.loads(pathlib.Path("release/published-release.json").read_text())
          prefix = f"https://github.com/{repo}/releases/download/{tag}/"
          names = {item["name"]: item["browser_download_url"] for item in release["assets"]}
          required = [f"playden-ps5-{version}.zip", "playden-kit-0.21.zip", "playden-update.json", "SHA256SUMS"]
          for name in required:
              if names.get(name) != prefix + name:
                  raise SystemExit("a release asset is not this fork's download")
          published = json.loads(pathlib.Path("release/published/playden-update.json").read_text())
          if published["kit"]["asset"] != "playden-kit-0.21.zip" or "leolobato" in json.dumps(published):
              raise SystemExit("published manifest does not name this fork's kit asset")
          print("published-kit-asset:", published["kit"]["asset"])
          print("published-assets-are-this-fork: yes")
          PY
          rm -f release/published-release.json
